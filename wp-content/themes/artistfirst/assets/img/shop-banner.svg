<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-label="Music First — vinili e CD autografati">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#eae4d7"/>
			<stop offset="1" stop-color="#d8d1c2"/>
		</linearGradient>
		<radialGradient id="shine" cx="38%" cy="32%" r="70%">
			<stop offset="0" stop-color="#2a2a2c"/>
			<stop offset="0.55" stop-color="#101011"/>
			<stop offset="1" stop-color="#050506"/>
		</radialGradient>
		<radialGradient id="orange" cx="35%" cy="30%" r="75%">
			<stop offset="0" stop-color="#f3f0e9"/>
			<stop offset="1" stop-color="#c9c3b6"/>
		</radialGradient>
		<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#0b0b0c" flood-opacity="0.28"/>
		</filter>
		<pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
			<path d="M60 0H0v60" fill="none" stroke="#0b0b0c" stroke-opacity="0.05"/>
		</pattern>
	</defs>

	<rect width="1200" height="1000" fill="url(#bg)"/>
	<rect width="1200" height="1000" fill="url(#grid)"/>

	<g opacity="0.55" font-family="Helvetica, Arial, sans-serif" fill="#0b0b0c" font-size="15" letter-spacing="6">
		<text x="70" y="82">MUSIC FIRST</text>
		<text x="70" y="110" fill="#0b0b0c">SIGNED EDITIONS</text>
	</g>

	<g filter="url(#shadow)" transform="rotate(-9 540 560)">
		<circle cx="540" cy="560" r="300" fill="url(#shine)"/>
		<g fill="none" stroke="#f3f0e9" stroke-opacity="0.1">
			<circle cx="540" cy="560" r="282"/>
			<circle cx="540" cy="560" r="264"/>
			<circle cx="540" cy="560" r="246"/>
			<circle cx="540" cy="560" r="228"/>
			<circle cx="540" cy="560" r="210"/>
			<circle cx="540" cy="560" r="192"/>
			<circle cx="540" cy="560" r="174"/>
			<circle cx="540" cy="560" r="156"/>
			<circle cx="540" cy="560" r="138"/>
		</g>
		<circle cx="540" cy="560" r="96" fill="url(#orange)"/>
		<circle cx="540" cy="560" r="8" fill="#0b0b0c"/>
		<text x="540" y="532" text-anchor="middle" fill="#0b0b0c" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1">MUSIC</text>
		<text x="540" y="554" text-anchor="middle" fill="#0b0b0c" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1">FIRST</text>
		<text x="540" y="580" text-anchor="middle" fill="#0b0b0c" font-family="Helvetica, Arial, sans-serif" font-size="8" letter-spacing="3">A1 ENT.</text>
	</g>

	<g filter="url(#shadow)" transform="rotate(7 850 470)">
		<circle cx="850" cy="470" r="210" fill="url(#shine)"/>
		<g fill="none" stroke="#f3f0e9" stroke-opacity="0.09">
			<circle cx="850" cy="470" r="196"/>
			<circle cx="850" cy="470" r="182"/>
			<circle cx="850" cy="470" r="168"/>
			<circle cx="850" cy="470" r="154"/>
			<circle cx="850" cy="470" r="140"/>
			<circle cx="850" cy="470" r="126"/>
			<circle cx="850" cy="470" r="112"/>
		</g>
		<circle cx="850" cy="470" r="72" fill="#f3f0e9"/>
		<circle cx="850" cy="470" r="6" fill="#0b0b0c"/>
		<text x="850" y="462" text-anchor="middle" fill="#0b0b0c" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">ARTIST</text>
		<text x="850" y="480" text-anchor="middle" fill="#0b0b0c" font-family="Georgia, serif" font-style="italic" font-size="16">first</text>
	</g>

	<g transform="rotate(-3 400 830)">
		<rect x="170" y="690" width="360" height="360" fill="#0b0b0c" filter="url(#shadow)"/>
		<rect x="196" y="716" width="308" height="308" fill="none" stroke="#f3f0e9" stroke-opacity="0.2"/>
		<text x="350" y="840" text-anchor="middle" fill="#f3f0e9" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-1">ARTIST</text>
		<text x="350" y="876" text-anchor="middle" fill="#f3f0e9" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-1">FIRST</text>
		<text x="350" y="912" text-anchor="middle" fill="#f3f0e9" font-family="Georgia, serif" font-style="italic" font-size="22">music first</text>
		<circle cx="350" cy="960" r="4" fill="#f3f0e9"/>
	</g>

	<g transform="rotate(14 920 800)" opacity="0.96">
		<rect x="800" y="700" width="230" height="230" fill="#f3f0e9" filter="url(#shadow)"/>
		<rect x="824" y="724" width="182" height="182" fill="#0b0b0c"/>
		<text x="915" y="800" text-anchor="middle" fill="#f3f0e9" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700">A1</text>
		<text x="915" y="828" text-anchor="middle" fill="#f3f0e9" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="4">ENTERTAINMENT</text>
